name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/scripts/**"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", ".github/scripts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # One-node replica set (transactions need a replica set, like Atlas).
      TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB 8.0 (replica set)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-mongo.sh"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
