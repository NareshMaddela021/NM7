name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nm7
          POSTGRES_PASSWORD: nm7
          POSTGRES_DB: nm7_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nm7" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nm7:nm7@localhost:5432/nm7_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations are up to date with the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://nm7:nm7@localhost:5432/nm7_test
      - run: uv run pytest -q
