name: e2e

# Browser tests against the real API, desktop + 390 px. Two modes, set by the repository variable CI_MODE (Settings →
# Secrets and variables → Actions → Variables):
#   full: every pull request runs the whole suite (job "live", about 35 min);
#   light (the default when CI_MODE isn't set): every pull request runs only the quick check (job "quick", about
#          10 min): a smoke set plus the specs
#          related to the changed files (.github/scripts/pick-e2e.mjs). The whole suite ("live", plus the production
#          build with the vercel.json headers and the sample-data tests on the preview build) runs nightly at 03:00
#          IST on the production branch and whenever it is started by hand (Actions → e2e → Run workflow).
# Back to full on pull requests: set CI_MODE=full. Schedules start from the default branch
# (main), which must have this file.
on:
  pull_request:
    branches: ["claude/fervent-albattani-wqmaoq", "main"]
    paths-ignore: ["**/*.md", "docs/**"]
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      shots_ref:
        description: "Screenshots only: the branch or commit to photograph (empty = run the tests)"
        required: false
        default: ""
      specs:
        description: "Only these spec files (space-separated, e.g. e2e-live/customer.spec.mjs); empty = all"
        required: false
        default: ""
      shots_spec:
        description: "Screenshots only: which script (zz-shots.spec.mjs = dashboard, zz-shots-company.spec.mjs = company)"
        required: false
        default: zz-shots.spec.mjs
      shots_dir:
        description: "Screenshots only: folder under docs/redesign (phase2b, phase3, ...)"
        required: false
        default: phase2b
      shots_label:
        description: "Screenshots only: artifact name (before / after)"
        required: false
        default: after

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.shots_ref && inputs.shots_label || 'tests' }}
  cancel-in-progress: true

jobs:
  quick:
    # light mode (CI_MODE unset or light), pull requests: the smoke set and the specs related to this change
    if: github.event_name == 'pull_request' && vars.CI_MODE != 'full'
    runs-on: ubuntu-24.04 # pinned: Playwright has no Chromium for ubuntu-26.04 yet (18 Nov)
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch too: the changed files pick the specs
      - name: Start MongoDB (replica set)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-mongo.sh"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: Install the API
        working-directory: backend
        run: uv sync --frozen
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Pick the specs (smoke + related to the changed files)
        id: pick
        run: |
          specs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | node ../.github/scripts/pick-e2e.mjs)
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "Quick check runs: $specs" >> "$GITHUB_STEP_SUMMARY"
          echo "$specs"
      - name: Quick browser tests against the real API, desktop + 390 px (a failed test is retried once)
        run: npx playwright test -c playwright.live.config.mjs --retries=1 ${{ steps.pick.outputs.specs }}
      - name: API log (on failure)
        if: failure()
        run: tail -n 400 e2e-live/.api.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-quick-results
          path: |
            frontend/test-results
            frontend/e2e-live/.api.log
          retention-days: 7

  live:
    # the whole suite: nightly, by hand, and on pull requests when CI_MODE=full
    if: (github.event_name != 'pull_request' || vars.CI_MODE == 'full') && !inputs.shots_ref
    runs-on: ubuntu-24.04 # pinned: Playwright has no Chromium for ubuntu-26.04 yet (18 Nov)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
        with:
          # the nightly run tests the production branch (schedules start from the default branch)
          ref: ${{ github.event_name == 'schedule' && 'claude/fervent-albattani-wqmaoq' || '' }}
      - name: Start MongoDB (replica set)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-mongo.sh"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: Install the API
        working-directory: backend
        run: uv sync --frozen
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the real API (a failed test is retried once)
        run: npx playwright test -c playwright.live.config.mjs --retries=1 ${{ inputs.specs }}
      - name: Production build with the vercel.json headers (CSP, 404)
        run: npm run test:e2e:csp
      - name: Browser tests on the preview build (sample data)
        run: npm run test:e2e
      - name: API log (on failure)
        if: failure()
        run: tail -n 400 e2e-live/.api.log || true  # the last lines only, so the test results above stay in the reachable log; the full log is in the artifact
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-results
          path: |
            frontend/test-results
            frontend/e2e-live/.api.log
          retention-days: 7

  shots:
    # by hand only, with shots_ref set: screenshots of every dashboard page (e2e-live/zz-shots.spec.mjs)
    if: inputs.shots_ref != ''
    runs-on: ubuntu-24.04 # pinned: Playwright has no Chromium for ubuntu-26.04 yet (18 Nov)
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      SHOTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use the app from app_ref, with this branch's screenshot script
        working-directory: .
        run: |
          mkdir -p /tmp/shotspec && cp frontend/e2e-live/zz-shots*.spec.mjs /tmp/shotspec/
          git checkout "${{ inputs.shots_ref }}" 2>/dev/null || git checkout "origin/${{ inputs.shots_ref }}"
          cp /tmp/shotspec/*.spec.mjs frontend/e2e-live/
      - name: Start MongoDB (replica set)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-mongo.sh"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: Install the API
        working-directory: backend
        run: uv sync --frozen
      - run: npx playwright install --with-deps chromium
      - name: Screenshots
        run: npx playwright test -c playwright.live.config.mjs e2e-live/${{ inputs.shots_spec }}
      - name: Save the pictures on this branch (docs/redesign/<dir>/<label>)
        working-directory: .
        run: |
          mkdir -p /tmp/pics && cp frontend/shots/*.jpg /tmp/pics/
          git reset -q --hard && git clean -fdq frontend/e2e-live && git fetch -q origin "${{ github.ref_name }}" && git checkout -q -B "${{ github.ref_name }}" FETCH_HEAD
          dest="docs/redesign/${{ inputs.shots_dir }}/${{ inputs.shots_label }}"
          rm -rf "$dest" && mkdir -p "$dest" && cp /tmp/pics/*.jpg "$dest/"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest" && git commit -qm "Screenshots: ${{ inputs.shots_label }} (${{ inputs.shots_ref }})" || exit 0
          for i in 1 2 3 4; do git push -q origin "HEAD:${{ github.ref_name }}" && break; git pull -q --rebase --autostash origin "${{ github.ref_name }}"; sleep $((i*5)); done
