name: shots

# Screenshots of every dashboard page with the demo students, desktop + 390 px (by hand only: Actions → shots →
# Run workflow). app_ref: the branch or commit whose app is photographed (e.g. main for "before"); the screenshot
# script always comes from the branch the workflow runs on. The pictures are the "shots-<label>" artifact.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch or commit to photograph
        required: true
        default: main
      label:
        description: Name for the artifact (e.g. before, after)
        required: true
        default: after

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      SHOTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use the app from app_ref, with this branch's screenshot script
        working-directory: .
        run: |
          cp frontend/e2e-live/zz-shots.spec.mjs /tmp/zz-shots.spec.mjs
          git checkout "${{ inputs.app_ref }}" 2>/dev/null || git checkout "origin/${{ inputs.app_ref }}"
          cp /tmp/zz-shots.spec.mjs frontend/e2e-live/zz-shots.spec.mjs
      - name: Start MongoDB (replica set)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-mongo.sh"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: Install the API
        working-directory: backend
        run: uv sync --frozen
      - run: npx playwright install --with-deps chromium
      - name: Screenshots
        run: npx playwright test -c playwright.live.config.mjs e2e-live/zz-shots.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ inputs.label }}
          path: frontend/shots
          retention-days: 30
