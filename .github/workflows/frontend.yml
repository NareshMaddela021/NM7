name: frontend

on:
  push:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml", ".github/scripts/**"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml", ".github/scripts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # The live browser tests run the real API (backend/) on this MongoDB replica set.
      TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Blog contract test against the live Hygraph API (same queries and build step as Vercel)
        run: HYGRAPH_CONTRACT=1 npx vitest run scripts/hygraph-contract.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (preview build, sample data)
        run: npm run test:e2e
      - name: Start MongoDB 8.0 (replica set)
        working-directory: .
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-mongo.sh"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install the API
        working-directory: backend
        run: uv sync --frozen
      - name: Browser tests against the real API
        run: npm run test:e2e:live
      - name: Production build with the vercel.json headers (CSP, 404)
        run: npm run test:e2e:csp
      - name: API log (on failure)
        if: failure()
        run: cat e2e-live/.api.log || true
