name: frontend

# Runs once per change: on pull requests, and on pushes to the deployed branch. The unit/preview checks and the
# live browser tests run as two parallel jobs; the live job retries a flaky browser test once and keeps the
# traces of any failure as an artifact.
on:
  push:
    branches: ["claude/fervent-albattani-wqmaoq", "main"]
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml", ".github/scripts/**"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend.yml", ".github/scripts/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Known vulnerabilities in the shipped dependencies (dev tools are reported, not blocking)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (preview build, sample data)
        run: npm run test:e2e
      - name: Production build with the vercel.json headers (CSP, 404)
        run: npm run test:e2e:csp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-unit-results
          path: frontend/test-results
          retention-days: 7

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      # The live browser tests run the real API (backend/) on this MongoDB replica set.
      TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start MongoDB (replica set; 8.0 like Atlas, newer when the runner kernel refuses 8.0)
        working-directory: .
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-mongo.sh"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install the API
        working-directory: backend
        run: uv sync --frozen
      - name: Browser tests against the real API
        run: npm run test:e2e:live
      - name: API log (on failure)
        if: failure()
        run: cat e2e-live/.api.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-results
          path: |
            frontend/test-results
            frontend/e2e-live/.api.log
          retention-days: 7
