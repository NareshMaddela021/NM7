<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build a job-ready resume free — from photos, your own words or an old file, in 8 Indian languages. Colleges and job fairs run whole resume drives on Nm7: approvals, kiosks, printing and GST invoices." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nm7" />
    <meta property="og:title" content="Nm7 — Resume builder for every job seeker, resume drives for every campus" />
    <meta property="og:description" content="Free resume builder for job seekers in 8 Indian languages · resume drives, kiosks and GST invoices for colleges and job fairs." />
    <meta property="og:url" content="https://nm7.si/" />
    <meta property="og:image" content="https://nm7.si/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#121316" />
    <link rel="canonical" href="https://nm7.si/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The home page's first hero image (its largest paint). The build removes this line from every other page. -->
    <link rel="preload" as="image" href="/home/hero-btech.webp" type="image/webp" fetchpriority="high" data-home-only />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: the stylesheet applies once it arrives (display=swap keeps text visible). -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" data-async-css />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- Resume template fonts are loaded only when a resume preview needs them (src/pages/builder/fontLoader.js). -->
    <title>Nm7 — Resume builder for every job seeker, resume drives for every campus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
