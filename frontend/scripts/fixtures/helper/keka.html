<!-- Fixture: the shape of a Keka Hire apply card (formcontrolname in camelCase, month inputs, a yes / no question).
     Values are made up. -->
<kh-apply-form class="kh-careers-apply">
  <div class="kh-step-title">Personal details</div>
  <div class="kh-field"><label for="k1">First name</label><input id="k1" formcontrolname="firstName"></div>
  <div class="kh-field"><label for="k2">Last name</label><input id="k2" formcontrolname="lastName"></div>
  <div class="kh-field"><label for="k3">Email</label><input id="k3" formcontrolname="email"></div>
  <div class="kh-field"><label for="k4">Phone number</label><input id="k4" formcontrolname="phoneNumber"></div>
  <div class="kh-field"><label for="k5">Notice period</label><select id="k5" formcontrolname="noticePeriod"><option value="">Select</option><option>Immediate</option><option>30 Days</option><option>60 Days</option></select></div>
  <div class="kh-experience-block">
    <h3>Experience</h3>
    <div class="kh-field"><label for="k6">Company name</label><input id="k6" formcontrolname="companyName"></div>
    <div class="kh-field"><label for="k7">From</label><input id="k7" type="month" formcontrolname="fromDate"></div>
    <div class="kh-field"><label for="k8">To</label><input id="k8" type="month" formcontrolname="toDate"></div>
  </div>
  <fieldset class="kh-field"><legend>Are you willing to work from the job's city?</legend>
    <label><input type="radio" name="relocate" value="yes"> Yes</label><label><input type="radio" name="relocate" value="no"> No</label></fieldset>
  <div class="kh-field"><label for="k9">Resume</label><input id="k9" type="file" formcontrolname="resume"></div>
  <button type="submit" class="kh-btn">Submit application</button>
</kh-apply-form>
