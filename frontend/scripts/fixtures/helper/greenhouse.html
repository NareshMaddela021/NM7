<!-- Fixture: the shape of a Greenhouse job-board application (ids first_name / candidate-location / school--0, a
     custom question, a demographic question). Values are made up. -->
<form id="application_form" data-provides="greenhouse">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" type="text"></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" type="text"></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="job_application[email]" type="text"></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]" type="text"></div>
  <div class="field"><label for="candidate-location">Location (City)</label><input id="candidate-location" role="combobox" aria-autocomplete="list" aria-controls="loc-list"><ul id="loc-list" role="listbox"></ul></div>
  <div class="field"><label for="resume">Resume/CV</label><input id="resume" type="file" name="job_application[resume]"></div>
  <div class="field"><label for="cover_letter_text">Cover Letter</label><textarea id="cover_letter_text"></textarea></div>
  <div class="field"><label for="question_9001">LinkedIn Profile</label><input id="question_9001" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="question_9002">Website</label><input id="question_9002"></div>
  <div class="education--item" id="education-0">
    <label for="school--0">School</label><select id="school--0"><option value="">Select a school</option><option>Demo College of Commerce (demo)</option><option>Other</option></select>
    <label for="degree--0">Degree</label><select id="degree--0"><option value="">Select a degree</option><option>Bachelor's Degree</option><option>Bachelor of Commerce (B.Com)</option><option>Master's Degree</option></select>
    <label for="end-year--0">End year</label><input id="end-year--0" placeholder="YYYY">
  </div>
  <div class="field"><label for="dg">Gender</label><select id="dg"><option value="">Please select</option><option>Female</option><option>Male</option><option>Decline to self-identify</option></select></div>
  <input type="submit" id="submit_app" value="Submit Application">
</form>
