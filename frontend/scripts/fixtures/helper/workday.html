<!-- Fixture: the shape of a Workday apply flow page ("My Information" + "My Experience" on one page here), written
     by hand from the public markup: data-automation-id on every control, month / year date parts, a type-to-search
     school prompt, a drop-down button, a sign-in link in the header. Values are made up. -->
<div data-automation-id="applyFlowPage">
  <header><a data-automation-id="utilityMenuButton" href="#">Sign In</a></header>
  <h2 data-automation-id="pageHeaderTitle">My Information</h2>
  <div data-automation-id="formField-legalNameSection_firstName"><label for="i1">Given Name(s)</label><input id="i1" type="text" data-automation-id="legalNameSection_firstName"></div>
  <div data-automation-id="formField-legalNameSection_lastName"><label for="i2">Family Name</label><input id="i2" type="text" data-automation-id="legalNameSection_lastName"></div>
  <div data-automation-id="formField-email"><label for="i3">Email Address</label><input id="i3" type="text" data-automation-id="email"></div>
  <div data-automation-id="formField-phone-number"><label for="i4">Phone Number</label><input id="i4" type="text" data-automation-id="phone-number"></div>
  <div data-automation-id="formField-countryDropdown"><label id="l5">Country</label><button type="button" aria-haspopup="listbox" aria-labelledby="l5" data-automation-id="countryDropdown">India</button></div>
  <div data-automation-id="formField-addressSection_city"><label for="i6">City</label><input id="i6" type="text" data-automation-id="addressSection_city"></div>
  <div data-automation-id="formField-source"><label for="i7">How Did You Hear About Us?</label><input id="i7" type="text" data-automation-id="searchBox"></div>
  <h2>My Experience</h2>
  <div data-automation-id="workExperienceSection">
    <div data-automation-id="workExperience-1" role="group" aria-labelledby="we1">
      <h4 id="we1">Work Experience 1</h4>
      <div data-automation-id="formField-jobTitle"><label for="w1">Job Title</label><input id="w1" type="text" data-automation-id="jobTitle"></div>
      <div data-automation-id="formField-companyName"><label for="w2">Company</label><input id="w2" type="text" data-automation-id="company"></div>
      <div data-automation-id="formField-currentlyWorkHere"><label><input type="checkbox" data-automation-id="currentlyWorkHere"> I currently work here</label></div>
      <div data-automation-id="formField-startDate"><label>From</label>
        <input type="text" aria-label="Month" data-automation-id="dateSectionMonth-input"><input type="text" aria-label="Year" data-automation-id="dateSectionYear-input"></div>
      <div data-automation-id="formField-endDate"><label>To</label>
        <input type="text" aria-label="Month" data-automation-id="dateSectionMonth-input"><input type="text" aria-label="Year" data-automation-id="dateSectionYear-input"></div>
      <div data-automation-id="formField-roleDescription"><label for="w5">Role Description</label><textarea id="w5" data-automation-id="description"></textarea></div>
    </div>
    <button type="button" data-automation-id="add-button">Add Another</button>
  </div>
  <div data-automation-id="educationSection">
    <div data-automation-id="education-1" role="group">
      <h4>Education 1</h4>
      <div data-automation-id="formField-school"><label for="e1">School or University</label><input id="e1" type="text" role="combobox" aria-controls="e1-list" aria-autocomplete="list" data-automation-id="school"><div id="e1-list" role="listbox"></div></div>
      <div data-automation-id="formField-degree"><label for="e2">Degree</label><select id="e2" data-automation-id="degree"><option value="">Select One</option><option>Bachelor of Commerce (B.Com)</option><option>Bachelor of Technology (B.Tech)</option><option>MBA</option></select></div>
      <div data-automation-id="formField-fieldOfStudy"><label for="e3">Field of Study</label><input id="e3" type="text" data-automation-id="fieldOfStudy"></div>
      <div data-automation-id="formField-lastYearAttended"><label>To (Actual or Expected)</label><input type="text" aria-label="Year" data-automation-id="dateSectionYear-input"></div>
    </div>
  </div>
  <div data-automation-id="formField-resume"><label for="r1">Resume/CV</label><input id="r1" type="file" data-automation-id="file-upload-input-ref" style="display:none"><div data-automation-id="file-upload-drop-zone">Drop file here</div></div>
  <fieldset data-automation-id="formField-gender"><legend>Gender</legend><label><input type="radio" name="gender" value="f"> Female</label><label><input type="radio" name="gender" value="m"> Male</label></fieldset>
  <div data-automation-id="formField-agreement"><label><input type="checkbox" data-automation-id="agreementCheckbox"> I have read and agree to the Terms and Conditions</label></div>
  <div data-automation-id="g-recaptcha" class="g-recaptcha" data-sitekey="x"><input name="g-recaptcha-response" type="text"></div>
  <footer><button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button></footer>
</div>
