[project]
name = "nm7-api"
version = "0.1.0"
description = "Nm7 (nm7.si) backend — FastAPI + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "pydantic[email]>=2.9",
    "pyotp>=2.9",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # generated; long constraint strings

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import is the alembic package.
known-third-party = ["alembic"]
