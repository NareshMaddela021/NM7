[project]
name = "nm7-api"
version = "0.1.0"
description = "Nm7 (nm7.si) backend — FastAPI + MongoDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "pydantic[email]>=2.9",
    "pyotp>=2.9",
    "cryptography>=43",
    "pymongo>=4.13",
    "anthropic>=1.14.0",
    "sentry-sdk[fastapi]>=2.30",
    "fpdf2>=2.8.9",
    "uharfbuzz>=0.56.3",
]

[dependency-groups]
dev = [
    "pip-audit>=2.8",
    "pypdf>=6.21.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

