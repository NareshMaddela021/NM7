# Render Blueprint for the API (Singapore). In Render: New → Blueprint → pick this repo,
# set "Blueprint path" to backend/render.yaml. Secrets marked sync:false are entered in the dashboard.
# Testing setup (free plan; site on Vercel, API on *.onrender.com). For nm7.si later: add `domains: [api.nm7.si]`,
# set CORS_ORIGINS=https://nm7.si,https://www.nm7.si, COOKIE_DOMAIN=.nm7.si and COOKIE_SAMESITE=lax.
services:
  - type: web
    name: nm7-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    branch: claude/fervent-albattani-wqmaoq # the branch Render deploys (same as Vercel's production branch)
    autoDeployTrigger: commit # deploy every new commit on that branch (.github/workflows/deploy-check.yml verifies it)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: MONGODB_URI # MongoDB Atlas connection string (mongodb+srv://…) — paste it in the dashboard
        sync: false
      - key: MONGODB_DB
        value: nm7
      - key: SECRET_KEY
        generateValue: true
      # Encrypts admin authenticator secrets. Set by hand (sync: false) and kept in a password manager: were Render to
      # generate it again (a new service from this blueprint), every admin's two-step login would stop working.
      # Moving an existing service: copy its current value from the dashboard and paste the same one.
      - key: ENCRYPTION_KEY
        sync: false
      - key: TRUSTED_PROXY_HOPS # proxies in front of the API that append to X-Forwarded-For (Render: 1)
        value: "1"
      - key: CORS_ORIGINS # the frontend's production address (comma-separated list, no trailing slash)
        value: https://nm7-omega.vercel.app,https://nm7.si,https://www.nm7.si
      - key: CORS_ORIGIN_REGEX # Vercel preview deployments of project nm7, team nm-8
        value: ^https://nm7-[a-z0-9-]+-nm-8\.vercel\.app$
      - key: COOKIE_SAMESITE # site (vercel.app) and API (onrender.com) are different sites while testing
        value: none
      - key: ADMIN_SETUP_TOKEN # one-time owner setup at /admin/setup; delete after use (it stops working anyway)
        sync: false
      - key: EMAIL_PROVIDER # resend (default) or zeptomail
        value: resend
      - key: EMAIL_FROM # must be on the domain verified in Resend (nm7.si)
        value: Nm7 <no-reply@nm7.si>
      - key: EMAIL_REPLY_TO
        value: info@nm7.si
      - key: RESEND_API_KEY # Resend API key, "Sending access" for nm7.si — paste it in the dashboard
        sync: false
      # Snap photos: reading resume details from photos (Claude API). Without it the feature says "being switched on".
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL # cheapest model for reading photos; an unusable answer is retried once on claude-sonnet-5-5
        value: claude-haiku-5-5
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false


  # ---------------------------------------------------------------------------------------------------------------
  # Staging: the same image, a separate database, for Vercel preview deployments (so an unmerged branch can never
  # write production data). Deploys every commit of the production branch like nm7-api, so it is always the same
  # code one step ahead of a preview. Free plan (sleeps when idle; keep-alive pings it too).
  # Dashboard steps once (see README → Staging): paste MONGODB_URI (the same cluster is fine: the database name
  # differs), set ENCRYPTION_KEY to any new value, leave the Razorpay and Anthropic keys empty (payments and AI
  # answer "not configured" on staging), set RESEND_API_KEY only if you want real emails from staging.
  - type: web
    name: nm7-api-staging
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    branch: claude/fervent-albattani-wqmaoq
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod # production rules (Secure cookies, no /docs, no codes in the log) with staging data
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nm7_staging
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS # the preview deployments only; production stays on nm7-api
        value: https://nm7-git-staging-nm-8.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ^https://nm7-[a-z0-9-]+-nm-8\.vercel\.app$
      - key: COOKIE_SAMESITE
        value: none
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: Nm7 staging <no-reply@nm7.si>
      - key: EMAIL_REPLY_TO
        value: info@nm7.si
      - key: SITE_URL # links in emails point at the preview, not the live site
        value: https://nm7-git-staging-nm-8.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
