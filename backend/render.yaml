# Render Blueprint for the API (Singapore). In Render: New → Blueprint → pick this repo,
# set "Blueprint path" to backend/render.yaml. Secrets marked sync:false are entered in the dashboard.
# Testing setup (free plan, *.onrender.com addresses). For nm7.si later: add `domains: [api.nm7.si]`,
# set CORS_ORIGINS=https://nm7.si,https://www.nm7.si, COOKIE_DOMAIN=.nm7.si and COOKIE_SAMESITE=lax.
services:
  - type: web
    name: nm7-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase: { name: nm7-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY # encrypts admin authenticator secrets; never change it after admins are set up
        generateValue: true
      - key: CORS_ORIGINS # the frontend's address — change it if Render gave the static site a different one
        value: https://asuraa-resume.onrender.com
      - key: COOKIE_SAMESITE # site and API are different *.onrender.com sites while testing
        value: none
      - key: EMAIL_FROM
        value: noreply@nm7.si
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: nm7-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: nm7
    user: nm7
