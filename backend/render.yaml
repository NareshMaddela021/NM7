# Render Blueprint for the API (Singapore). In Render: New → Blueprint → pick this repo,
# set "Blueprint path" to backend/render.yaml. Secrets marked sync:false are entered in the dashboard.
# Testing setup (free plan; site on Vercel, API on *.onrender.com). For nm7.si later: add `domains: [api.nm7.si]`,
# set CORS_ORIGINS=https://nm7.si,https://www.nm7.si, COOKIE_DOMAIN=.nm7.si and COOKIE_SAMESITE=lax.
services:
  - type: web
    name: nm7-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: MONGODB_URI # MongoDB Atlas connection string (mongodb+srv://…) — paste it in the dashboard
        sync: false
      - key: MONGODB_DB
        value: nm7
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY # encrypts admin authenticator secrets; never change it after admins are set up
        generateValue: true
      - key: CORS_ORIGINS # the frontend's production address (comma-separated list, no trailing slash)
        value: https://nm7-omega.vercel.app,https://nm7.si,https://www.nm7.si
      - key: CORS_ORIGIN_REGEX # Vercel preview deployments of project nm7, team nm-8
        value: ^https://nm7-[a-z0-9-]+-nm-8\.vercel\.app$
      - key: COOKIE_SAMESITE # site (vercel.app) and API (onrender.com) are different sites while testing
        value: none
      - key: ADMIN_SETUP_TOKEN # one-time owner setup at /admin/setup; delete after use (it stops working anyway)
        sync: false
      - key: EMAIL_PROVIDER # resend (default) or zeptomail
        value: resend
      - key: EMAIL_FROM # must be on the domain verified in Resend (nm7.si)
        value: Nm7 <no-reply@nm7.si>
      - key: EMAIL_REPLY_TO
        value: info@nm7.si
      - key: RESEND_API_KEY # Resend API key, "Sending access" for nm7.si — paste it in the dashboard
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

