# Render Blueprint for the API (Singapore). In Render: New → Blueprint → pick this repo,
# set "Blueprint path" to backend/render.yaml. Secrets marked sync:false are entered in the dashboard.
# Testing setup (free plan; site on Vercel, API on *.onrender.com). For nm7.si later: add `domains: [api.nm7.si]`,
# set CORS_ORIGINS=https://nm7.si,https://www.nm7.si, COOKIE_DOMAIN=.nm7.si and COOKIE_SAMESITE=lax.
services:
  - type: web
    name: nm7-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase: { name: nm7-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY # encrypts admin authenticator secrets; never change it after admins are set up
        generateValue: true
      - key: CORS_ORIGINS # the frontend's production address (comma-separated list, no trailing slash)
        value: https://nm7.vercel.app
      - key: CORS_ORIGIN_REGEX # Vercel preview deployments, e.g. ^https://nm7-[a-z0-9-]+-<team-slug>\.vercel\.app$
        sync: false
      - key: COOKIE_SAMESITE # site (vercel.app) and API (onrender.com) are different sites while testing
        value: none
      - key: EMAIL_FROM
        value: noreply@nm7.si
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: nm7-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: nm7
    user: nm7
