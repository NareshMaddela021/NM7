# Render Blueprint for the API (Singapore). In Render: New → Blueprint → pick this repo,
# set "Blueprint path" to backend/render.yaml. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: nm7-api
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    domains: [api.nm7.si]
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase: { name: nm7-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://nm7.si,https://www.nm7.si
      - key: COOKIE_DOMAIN
        value: .nm7.si
      - key: EMAIL_FROM
        value: noreply@nm7.si
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: nm7-db
    region: singapore
    postgresMajorVersion: "16"
    databaseName: nm7
    user: nm7
